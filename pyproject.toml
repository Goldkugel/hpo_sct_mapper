[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo_sct_mapper"
version = "1.0.2"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.0.6",
    "adapter @ git+https://github.com/Goldkugel/adapter.git@v1.0.7",
    "embedder @ git+https://github.com/Goldkugel/embedder.git@v1.0.2",
    "model @ git+https://github.com/Goldkugel/model.git@v1.0.2",
    "normalizer @ git+https://github.com/Goldkugel/normalizer.git@v1.0.2"
]

[tool.setuptools]
packages = ["hpo_sct_mapper"]

[tool.setuptools.package-dir]
"hpo_sct_mapper" = "src"