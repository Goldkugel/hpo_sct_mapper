[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hpo_sct_mapper"
version = "1.3.1"
requires-python = ">=3.10"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.7.0",
    "adapter @ git+https://github.com/Goldkugel/adapter.git@v1.5.2",
    "embedder @ git+https://github.com/Goldkugel/embedder.git@v2.3.1",
    "model @ git+https://github.com/Goldkugel/model.git@v3.1.0",
    "normalizer @ git+https://github.com/Goldkugel/normalizer.git@v1.1.3"
]

[tool.setuptools]
packages = ["hpo_sct_mapper"]

[tool.setuptools.package-dir]
"hpo_sct_mapper" = "src"